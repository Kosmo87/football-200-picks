name: Build picks board

on:
  schedule:
    # Hourly. ESPN odds move through the day and CLV tracking needs the
    # latest price on open picks before kickoff.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      refresh_prior:
        description: "Re-pull the prior season instead of using the cache"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "build_board.py"
      - "elo.py"
      - "espn.py"
      - "odds.py"
      - "picks.py"
      - "selection_test.py"
      - "shop_ledger.py"
      - "shop_close_test.py"
      - "teaser.py"
      - "teaser_test.py"
      - "parlays.py"
      - "parlays_test.py"
      - "books.py"
      - "books_test.py"
      - "faults.py"
      - "faults_test.py"
      - "tripwire.py"
      - "futures.py"
      - "futures_test.py"
      - "teamnames.py"
      - "test-teamnames.py"
      - "staking.py"
      - "history_data.py"
      - "parity_test.js"
      - "parity_test.py"
      - "parity_check.py"
      # The site itself. Without this a front-end-only change never deploys and
      # sits unpublished until the next cron happens to run.
      - "public/**"
      - "netlify.toml"
      - "netlify/**"
      - "placements.py"
      - "placements_test.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-board.yml"

permissions:
  contents: write

concurrency:
  group: build-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Must live at job level: step-level env is not in scope for a step's own
      # `if:` condition, which silently skipped the deploy.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
      DELIVER_TO: ${{ vars.DELIVER_TO }}
      # Not a secret: site IDs are public in every deploy URL.
      NETLIFY_SITE_ID: fbbd4003-735c-46f1-b1da-bed28205ee4c
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          pip install --quiet requests
          # @netlify/blobs, for the bridge that lets the Python grader read the
          # placements the board wrote. `npm ci` also puts it in node_modules
          # for the CLI to bundle into the function.
          npm ci

      - name: Archive lines and results
        # Runs before the board so a build failure cannot cost us a snapshot.
        # ESPN drops betting lines once a game finals, so an hour not captured
        # is an hour gone for good.
        continue-on-error: true
        run: python archive.py

      - name: Scan for price gaps, freeze closing lines, grade the ledger
        # Scanning is rate-limited inside the script to once every 8 hours, so
        # running on the hourly build costs about 6 credits a day against the
        # free tier's 500 a month. Grading costs nothing and runs regardless.
        #
        # --close costs a call per league only in an hour when a logged bet is
        # actually about to start, which on a football weekend is perhaps ten
        # hours out of the week — call it 80 a month on top of scanning's 180.
        # Worth it: after kickoff the closing market is gone and the question
        # "did this price beat the market" can never be answered for that bet.
        # Win/loss on moneyline dogs at +400 is noise for a whole season; CLV
        # is readable in weeks.
        continue-on-error: true
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY not set — skipping the price scan."
            echo "Set it with: gh secret set ODDS_API_KEY --repo Kosmo87/football-200-picks"
            exit 0
          fi
          python shop_ledger.py --close --scan --grade
          python shop_ledger.py --report

      - name: Scan for stale lines
        # CONCENTRATED, because the budget will not stretch to hourly.
        #
        # A fault stands about an hour -- MGM's Arizona State inversion on
        # 13 Sep appeared and corrected inside one. So catch probability is
        # simply the scan gap: hourly 100%, every 2h 50%, every 4h 25%, three
        # times a day 12%. Hourly all week is 1,456 credits a month against a
        # 500 free tier, so it cannot be bought with this key.
        #
        # Weighted to game days on purpose: that is when lines move, when
        # books are updating fastest, and when the ones that are not stand out.
        #
        # COST, corrected. This step runs `--markets spreads,h2h` over two
        # leagues, so a scan is 4 credits, not the 2 an earlier version of this
        # comment budgeted for (it also said h2h was skipped; h2h was added
        # with the moneyline transposition alert and is deliberate -- an
        # inverted moneyline is the most valuable fault this finds).
        #
        # So the floor schedule below is 11 scans a week = 44 credits, ~190 a
        # month, BEFORE the movement-triggered scans that fire whenever the
        # tripwire sees a line move. Measured: 297 of 500 credits spent by
        # 15 September, with the board, closing lines, futures and the weekend
        # message also drawing on the same key. Watch the remaining count in
        # this step's log; if it runs short, drop h2h here before touching the
        # floor slots, since spreads carry most of the signal.
        continue-on-error: true
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY not set — skipping fault scan."
            exit 0
          fi
          # TRIGGERED, not timed.
          #
          # tripwire.py polls ESPN for DraftKings' number on every upcoming
          # game -- free, no key, no quota, 79 games on a September weekend --
          # and compares it against the last snapshot. It exits 10 when a line
          # has moved a point or more, which is the only thing that creates a
          # stale line: the market moves and a slow book does not follow.
          #
          # So a credit is spent at the moment it is worth something instead of
          # on a timer. A fixed schedule could afford three looks a day against
          # windows that last about an hour, which misses seven in eight. This
          # watches every hour for nothing and pays only on movement.
          #
          # A floor still runs on slate mornings even without movement, because
          # a book can hang a bad number with no market move at all -- BetMGM's
          # transposed Arizona State record produced nothing to trip on.
          set +e
          python tripwire.py --check
          MOVED=$?
          set -e
          HOUR=$(date -u +%H); DOW=$(date -u +%u)
          FLOOR=no
          # Floor slots sit an hour BEFORE kickoff windows, which is when books
          # move fastest and hang broken numbers. The old set missed the one that
          # matters most: Sunday 12:00 UTC is 8am ET, before NFL lines firm up,
          # and 18:00 UTC is 2pm ET, after the 1pm games have already started.
          case "$DOW" in
            7) case "$HOUR" in 12|16|19|23) FLOOR=yes;; esac ;;   # Sun: pre-1pm, pre-4pm, pre-SNF
            6) case "$HOUR" in 12|15|18|23) FLOOR=yes;; esac ;;   # Sat: college all day
            1) case "$HOUR" in 22) FLOOR=yes;; esac ;;            # Mon night
            4) case "$HOUR" in 22) FLOOR=yes;; esac ;;            # Thu night
            5) case "$HOUR" in 17) FLOOR=yes;; esac ;;
          esac
          if [ "$MOVED" != "10" ] && [ "$FLOOR" != "yes" ]; then
            echo "No movement and not a floor slot — no credits spent."
            exit 0
          fi
          [ "$MOVED" = "10" ] && echo "Lines moved — scanning." \
                              || echo "Floor scan (day $DOW hour $HOUR)."
          python faults.py --scan --alert --markets spreads,h2h

      - name: Log and grade board calibration
        # The only question that decides whether the board is worth reading:
        # do bets labelled 93% win about 93 times in a hundred? Graded on
        # WINNING, not on price.
        #
        # Logged once per bet, before anything is known, so the claim cannot be
        # revised after the fact. Graded only once the kickoff has passed AND
        # the matched event contains both teams -- the first version matched on
        # team name alone and settled 46 of 51 claims instantly against earlier
        # fixtures, reporting Notre Dame as winning 52-0 in a game that had not
        # been played. It produced a complete calibration table and every row
        # of it was fiction.
        continue-on-error: true
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY not set — skipping calibration."
            exit 0
          fi
          python calibration.py --grade
          HOUR=$(date -u +%H); DOW=$(date -u +%u)
          if { [ "$DOW" = "6" ] || [ "$DOW" = "7" ]; } && [ "$HOUR" = "12" ]; then
            python calibration.py --log
          fi
          python calibration.py --report || true

      - name: Capture Super Bowl futures
        # Once a day, in the 12:00 UTC hour only. 30 credits a month for a
        # daily strength reading on all 32 teams.
        #
        # This is a MEASUREMENT, not a signal. Futures explain 88.5% of the
        # variance in the week's spreads (r = 0.941), which sounds like an edge
        # and is the opposite: they are priced by the same books off the same
        # opinion, and the 11.5% they do not share is game-specific news the
        # game line has and a season-long price cannot. The largest residual on
        # 13 Sep was ATL @ PIT, because Atlanta's top two quarterbacks were
        # out. Trading that residual means backing teams whose starters just
        # got hurt.
        #
        # It is captured anyway for two reasons: futures are a better early
        # season strength prior than our EPA ratings while nflverse has 234
        # plays of 2026 populated, and futures.py --encompass cannot run at all
        # without a history. That test decides whether the residual is worth
        # anything, and it needs ~40 completed games before it says so.
        continue-on-error: true
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY not set — skipping futures capture."
            exit 0
          fi
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "12" ]; then
            python futures.py --capture
            python futures.py --trend 7 || true
          else
            echo "Not the 12:00 UTC hour ($HOUR) — futures capture skipped."
          fi

      - name: Send the morning message
        # SLATE MORNINGS ONLY, in the 12:00-13:59 UTC hour (early morning US).
        #
        # Two rules, and the second is the one that was wrong.
        #
        # The hour: send once, on the day, while the prices named are still
        # live. Any other hour is a no-op.
        #
        # The DAY: Saturday for the college slate and Sunday for the NFL one.
        # It used to send every morning, which meant five messages a week
        # priced off numbers nobody had bet into yet. That is not a harmless
        # extra email -- a line hung on a Saturday game the previous Tuesday
        # is a placeholder, it moves, and the teaser bands this board feeds
        # are calibrated on CLOSING lines, so an early number is a different
        # bet wearing the same label. Measured on week 1: lines moved 0.38
        # points on average over five days and ATL @ PIT moved three.
        #
        # Thursday night games are deliberately not covered. Adding a Thursday
        # send would mean a third message for one or two games, and the same
        # board is available Saturday morning for whatever is left.
        continue-on-error: true
        run: |
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)   # 1=Mon .. 6=Sat, 7=Sun
          if [ "$HOUR" != "12" ] && [ "$HOUR" != "13" ]; then
            echo "Not the sending hour (UTC $HOUR) — skipping."
            exit 0
          fi
          if [ "$DOW" != "6" ] && [ "$DOW" != "7" ]; then
            echo "Not a slate morning (UTC day $DOW) — skipping."
            echo "Saturday is the college slate, Sunday the NFL one."
            exit 0
          fi
          # Window per slate, not one number for both.
          #
          # Saturday's college slate finishes inside 18 hours. Sunday's NFL
          # one does not: Monday Night Football kicks off about 36 hours after
          # a Sunday-morning send, so an 18-hour window silently drops it. That
          # already cost a real recommendation -- the best BetMGM teaser leg
          # on 13 Sep was Denver at Monday night, and the message fell back to
          # a worse leg that teased onto a whole number.
          if [ "$DOW" = "7" ]; then HOURS=42; else HOURS=20; fi
          echo "Slate window: ${HOURS}h"
          if [ -z "$RESEND_API_KEY" ] || [ -z "$DELIVER_TO" ]; then
            echo "::warning::RESEND_API_KEY or DELIVER_TO missing — rendering only."
            python delivery.py --dry-run --hours "$HOURS"
            exit 0
          fi
          python delivery.py --to "$DELIVER_TO" --hours "$HOURS"

      - name: Freeze closing prop lines
        # Costs one scan (about 14 entities against 2,500 a month) and only in
        # an hour when a logged line is actually about to start. After kickoff
        # the market is gone and "did this price beat the market" can never be
        # answered for that line again.
        continue-on-error: true
        run: |
          if [ -z "$SGO_API_KEY" ]; then exit 0; fi
          python props.py --close || true

      - name: Grade finished prop lines
        # Free — it reads box scores the board already pulls — so it runs every
        # hour rather than only in the collection hour. Collecting without
        # grading would accumulate prices nobody ever settles, which is a data
        # set that cannot answer the question it was gathered for.
        continue-on-error: true
        run: python props.py --grade || true

      - name: Log QB passing-TD lines
        # Collection, not a model. The free tier serves LIVE lines only, so the
        # history a backtest would need does not exist anywhere and can only be
        # accumulated forward — every week this does not run is a week that
        # cannot be tested later.
        #
        # Once a day, not hourly. The allowance is 2,500 objects a month and one
        # scan of the NFL slate is about 250, so daily is roughly 7,500 a month
        # on a Sunday-heavy schedule — too many. Restricted to the 12:00 UTC
        # hour, which puts it near opening lines on a game day.
        continue-on-error: true
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" != "12" ]; then
            echo "Not the collection hour (UTC $HOUR) — skipping."
            exit 0
          fi
          if [ -z "$SGO_API_KEY" ]; then
            echo "::warning::SGO_API_KEY not set — no props collected."
            exit 0
          fi
          python props.py --scan
          python props.py --report

      - name: Settle the bets you tagged
        # Reads the blob store the board's checkboxes write to, settles what has
        # finished against ESPN finals, writes the results back, and mirrors the
        # rows into data/archive so they are in the repo and in a diff.
        #
        # Free: it reuses the box scores the board already pulls. Separate from
        # the two ledgers above on purpose -- those measure whether a strategy
        # works, this measures what was actually bet, and averaging the two
        # would describe a strategy nobody followed.
        continue-on-error: true
        run: |
          python placements.py --grade
          python placements.py --publish
          python placements.py --report

      - name: Build board
        run: |
          python build_board.py \
            ${{ inputs.refresh_prior && '--refresh-prior' || '' }}

      - name: Test bet settlement
        run: python placements_test.py

      - name: Test the ledger's closing and grading
        # close() raised TypeError on its first line for a week. The raise was
        # caught by a broad except, reported as "live prices unavailable", and
        # swallowed again by continue-on-error on the step that calls it — so
        # the ledger collected twenty-three rows and zero closing prices with
        # nothing anywhere saying so. These stub the network, so they run here
        # whether or not a key is present, and they are NOT continue-on-error.
        run: |
          python shop_close_test.py
          python teaser_test.py
          python parlays_test.py
          python books_test.py
          python faults_test.py
          python futures_test.py
          python test-teamnames.py

      - name: Test pick selection
        # The parlay rules. Both were written after uncapping the list exposed
        # what the engine does when allowed to keep going, and both regress
        # silently -- the symptom is a longer list, not an error.
        run: python selection_test.py

      - name: Verify engine parity
        # The browser re-implements pick selection; a drift here means the site
        # would show different tips than the Python engine that logs the ledger.
        run: |
          node parity_test.js > /tmp/js.json
          python parity_test.py > /tmp/py.json
          python parity_check.py /tmp/js.json /tmp/py.json

      - name: Commit refreshed data
        # The push RACES anything else landing on main.
        #
        # This job checks out main, spends five to seven minutes fetching and
        # building, and only then pushes. Any commit that lands in that window
        # -- a person pushing, or the previous hourly run finishing late --
        # makes this push a non-fast-forward, and the job fails with everything
        # else already green: board built, parity passed, tests passed. It also
        # skips the deploy, so a perfectly good build never reaches the site.
        # Three runs failed this way in one evening, all of them "rejected
        # (fetch first)" and nothing else wrong.
        #
        # So: rebase onto whatever arrived and try again.
        #
        # -X theirs is correct here and reads backwards. During a rebase the
        # checked-out side is the branch being replayed ONTO (origin/main, the
        # newer commit), and "theirs" is the commit being replayed -- ours, the
        # one holding the data we just built. Conflicts can only occur in files
        # this commit touches, and every one of those is generated output, so
        # preferring the freshly built version is always right.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data cache data/archive
          if git diff --staged --quiet; then
            echo "No board changes."
            exit 0
          fi
          git commit -m "Rebuild board $(date -u +'%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — main moved while this build was running."
            git fetch origin main || exit 1
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase onto origin/main; leaving main alone."
              exit 1
            fi
            echo "Rebased onto $(git rev-parse --short origin/main), retrying."
          done
          echo "::error::Still could not push after 3 attempts."
          exit 1

      - name: Deploy to Netlify
        # Uploads the finished public/ folder. Netlify never clones the repo, so
        # this costs no build minutes. Runs every time so the live site always
        # matches main, whether the code or just the board data changed.
        run: |
          # Guard in bash rather than `if:` so a missing or empty token is
          # visible in the log instead of silently skipping the whole step.
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN is empty (${#NETLIFY_AUTH_TOKEN} chars) — skipping deploy."
            echo "Set the NETLIFY_AUTH_TOKEN repository secret to a Netlify personal access token."
            exit 0
          fi
          echo "Token present (${#NETLIFY_AUTH_TOKEN} chars). Deploying…"
          # --functions is explicit rather than left to netlify.toml: --dir
          # already overrides the configured publish directory, and a silently
          # un-deployed function would take the board's checkboxes down without
          # failing this step.
          npx --yes netlify-cli@27 deploy \
            --prod \
            --dir=public \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --message="Board $(date -u +'%Y-%m-%d %H:%M UTC')"
